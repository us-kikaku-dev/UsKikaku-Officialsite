[build]
  command = "npm run build:site"
  publish = "dist"

# ─────────────────────────────────────────────
# セキュリティヘッダー（監査バッチ6）
# CSPの許可先は実測した外部オリジンのみ:
#   microCMS API/画像・EmailJS・reCAPTCHA v2（Google公式FAQ準拠のパス限定）・
#   Google Fonts・Google Maps埋め込み
# 変更時はDeploy Previewで reCAPTCHAチャレンジ表示〜フォーム送信・地図・
# 記事画像・フォントをEnforce状態で確認すること
# ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.microcms-assets.io; connect-src 'self' https://uskikaku.microcms.io https://irmedia.microcms.io https://api.emailjs.com https://www.google.com/recaptcha/; frame-src https://www.google.com https://maps.google.com https://recaptcha.google.com/recaptcha/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; script-src-attr 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# アセット最適化によるURL正規化（/company → /company/ 等のリダイレクト）を無効化し、
# ルーティングを下記の明示的な200 rewriteのみで決定論的に制御する。
# canonical / sitemap / og:url は「末尾スラッシュなし」で統一している。
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# ─────────────────────────────────────────────
# 既知ルート → ビルド時生成のSEOスタブHTMLへ 200 rewrite（URLは変わらない）。
# 実ファイルが存在するパスは shadowing により rewrite より優先される。
# ─────────────────────────────────────────────
[[redirects]]
  from = "/company"
  to = "/company.html"
  status = 200

[[redirects]]
  from = "/service"
  to = "/service.html"
  status = 200

[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/news"
  to = "/news.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/tashiro"
  to = "/tashiro.html"
  status = 200

[[redirects]]
  from = "/tashiro/articles"
  to = "/tashiro/articles.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# 記事詳細（生成済みIDのみHTMLが存在する。存在しないIDは404にフォールバック）
[[redirects]]
  from = "/news/*"
  to = "/news/:splat.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat.html"
  status = 200

# ─────────────────────────────────────────────
# 未知URLは実404（SPAフォールバックは廃止済み）。
# 必ず最後に置き、force は付けないこと（実ファイルの配信を妨げない）。
# 新記事の公開反映には再デプロイが必要（microCMS Webhook → Netlify Build Hook）。
# ─────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
